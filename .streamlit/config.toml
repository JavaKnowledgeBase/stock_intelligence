[server]
headless = true
port = 8501
maxUploadSize = 50
maxMessageSize = 200
runOnSave = false
enableXsrfProtection = true
enableCORS = false

[browser]
gatherUsageStats = false

[runner]
fastReruns = true
magicEnabled = false

[theme]
base = "dark"
primaryColor      = "#58a6ff"
backgroundColor   = "#0d1117"
secondaryBackgroundColor = "#161b22"
textColor         = "#c9d1d9"
font              = "sans serif"

[logger]
level = "warning"
messageFormat = "%(asctime)s %(levelname)s %(message)s"
